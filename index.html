<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Library Prototype</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
    }

    .hint {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: sans-serif;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="hint">
  WASDキー：移動<br>
  マウス：視点移動<br>
  本をクリック：書誌ページを開く
</div>

<a-scene background="color: #ECECEC">

  <!-- カメラ -->
  <a-entity
    position="0 1.6 4">

    <a-camera>
      <a-cursor
        color="#333"
        raycaster="objects: .clickable">
        </a-cursor>
    </a-camera>
  </a-entity>

  <!-- 床 -->
  <a-plane
    rotation="-90 0 0"
    width="30"
    height="30"
    color="#d9d9d9">
  </a-plane>

  <!-- 壁 -->
  <a-plane
    position="0 4 -8"
    width="20"
    height="10"
    color="#f5f5f5">
  </a-plane>

  <!-- タイトル -->
  <a-text
    value="Virtual Library Prototype"
    position="-3 7 -7.9"
    color="#222"
    width="12">
  </a-text>

  <a-box
  position="0 1 -5"
  depth="0.5"
  height="0.2"
  width="8"
  color="#8B5A2B">
  </a-box>
  
  <!-- ===================================== -->
  <!-- 銀河鉄道の夜 -->
  <!-- ===================================== -->

  <!-- 本の表紙 -->
<a-plane
  position="-2 2 -5"
  width="1.5"
  height="2.2"
  src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Ginga_tetsudo_no_yoru.jpg/800px-Ginga_tetsudo_no_yoru.jpg"
  class="clickable"
  link-handler="url: https://www.aozora.gr.jp/cards/000081/card43737.html">
</a-plane>

  <!-- タイトル -->
  <a-text
    value="銀河鉄道の夜"
    position="-2.7 0.6 -4.9"
    color="#111"
    width="5">
  </a-text>

  <!-- ===================================== -->
  <!-- Digital computer design fundamentals -->
  <!-- ===================================== -->

  <!-- 本の表紙 -->
  <a-plane
    position="2 2 -5"
    width="1.5"
    height="2.2"
    src="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?q=80&w=800&auto=format&fit=crop"
    class="clickable">
  </a-plane>

  <!-- タイトル -->
  <a-text
    value="Digital computer design fundamentals"
    position="0.8 0.2 -4.9"
    color="#111"
    width="6">
  </a-text>

  <!-- クリック領域 -->
  <a-plane
    position="2 2 -4.95"
    width="1.5"
    height="2.2"
    material="opacity: 0"
    class="clickable"
    link-handler="url: https://catalog.hathitrust.org/Record/0044441157">
  </a-plane>

</a-scene>

<script>
  AFRAME.registerComponent('link-handler', {
    schema: {
      url: { type: 'string' }
    },

    init: function () {
      this.el.addEventListener('click', () => {
        window.open(this.data.url, '_blank');
      });
    }
  });
</script>

</body>
</html>
