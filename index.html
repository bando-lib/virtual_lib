<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Virtual Book Display - Interactive Demo</title>
    <!-- A-Frameのライブラリを読み込み -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- 追加：移動機能を有効にするためのライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- カスタムコンポーネント: クリックでリンクを開く -->
    <script>
      AFRAME.registerComponent('url-link', {
        schema: {url: {type: 'string'}},
        init: function () {
          this.el.addEventListener('click', function () {
            window.open(this.data.url, '_blank');
          }.bind(this));
        }
      });
      
      // カスタムコンポーネント: ISBNから書影を取得
      AFRAME.registerComponent('isbn-cover', {
        schema: { type: 'string' },
        init: function () {
          var el = this.el;
          var isbn = this.data;
          fetch('https://api.openbd.jp/v1/get?isbn=' + isbn)
            .then(response => response.json())
            .then(data => {
              if (data && data[0] && data[0].summary && data[0].summary.cover) {
                var coverUrl = data[0].summary.cover;
                el.setAttribute('src', coverUrl);
              } else {
                console.log('書影が見つかりませんでした: ' + isbn);
              }
            })
            .catch(err => console.error('APIエラー:', err));
        }
      });
    </script>
  </head>
  <body>
    <!-- rayOrigin: mouse を追加することで、マウスの場所で直接クリック可能になります -->
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: [url-link]">
      <a-assets>
        <!-- デフォルト画像 -->
        <img id="ginga-cover" src="https://placehold.jp/24/336699/ffffff/300x450.png?text=銀河鉄道の夜">
        <img id="comp-cover" src="https://placehold.jp/24/669933/ffffff/300x450.png?text=Digital+Computer">
      </a-assets>

      <!-- 2. 背景と地面 -->
      <a-sky color="#ECECEC"></a-sky>
      <!-- 地面（位置を0 0 0に） -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
      
      <!-- ★棚の高さを下げる (position.y = 1.15 -> 0.05) -->
      <a-box position="0 0.05 -2" width="3.5" height="0.1" depth="0.8" color="#8B4513"></a-box>

      <!-- 3. 本の配置（面陳）★位置を棚に合わせて下げる -->
      
      <!-- 銀河鉄道の夜 (position.y = 1.5 -> 0.4) -->
      <a-box position="-0.9 0.4 -2" depth="0.05" height="0.6" width="0.4" 
             isbn-cover="4003107632" 
             url-link="url: https://www.aozora.gr.jp/cards/000081/card43737.html"
             animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
             animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      </a-box>

      <!-- はじめての行政法 (position.y = 1.5 -> 0.4) -->
      <a-box position="0 0.4 -2" depth="0.05" height="0.6" width="0.4" 
            isbn-cover="9784426122744" 
             url-link="url: https://elib.maruzen.co.jp/elib/html/BookDetail/Id/3000161362"
             animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
             animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      </a-box>

      <!-- アントレプレナーシップ (position.y = 1.5 -> 0.4) -->
      <a-box position="0.9 0.4 -2" depth="0.05" height="0.6" width="0.4"
             isbn-cover="9784641165984" 
             url-link="url: https://elib.maruzen.co.jp/elib/html/BookDetail/Id/3000131151"
             animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200"
             animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
      </a-box>

      <!-- カメラ設定：a-cursor を削除してスッキリさせます -->
  <a-entity id="rig" position="0 0 0" movement-controls="fly: false; speed: 0.2">
    <a-entity camera position="0 1.6 0" look-controls>
      <!-- 赤い丸（a-cursor）を消しました -->
    </a-entity>
  </a-entity>

      <!-- ★WASD移動と視線クリックの両立 -->
      <a-entity id="rig" position="0 0 0" movement-controls="fly: false; speed: 0.2">
        <a-entity camera position="0 1.6 0" look-controls>
          <a-cursor color="#FF0000" raycaster="objects: [url-link]"></a-cursor>
        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
