<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Virtual Book Display - Interactive Demo</title>
    <!-- A-Frameのライブラリを読み込み -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- 追加：移動機能を有効にするためのライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- カスタムコンポーネント: クリックでリンクを開く -->
    <script>
      AFRAME.registerComponent('url-link', {
        schema: {url: {type: 'string'}},
        init: function () {
          this.el.addEventListener('click', function () {
            window.open(this.data.url, '_blank');
          }.bind(this));
        }
      });
      
      // カスタムコンポーネント: ISBNから書影を取得
      AFRAME.registerComponent('isbn-cover', {
        schema: { type: 'string' },
        init: function () {
          var el = this.el;
          var isbn = this.data;
          fetch('https://api.openbd.jp/v1/get?isbn=' + isbn)
            .then(response => response.json())
            .then(data => {
              if (data && data[0] && data[0].summary && data[0].summary.cover) {
                var coverUrl = data[0].summary.cover;
                el.setAttribute('src', coverUrl);
              } else {
                console.log('書影が見つかりませんでした: ' + isbn);
              }
            })
            .catch(err => console.error('APIエラー:', err));
        }
      });
    </script>
  </head><body>
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: [url-link]">
    <a-assets>
      <img id="default-cover" src="https://placehold.jp/24/cccccc/ffffff/300x450.png?text=Loading...">
    </a-assets>

    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#327fa8"></a-plane>
    
    <!-- 本を並べるための「親」要素 -->
    <a-entity id="book-shelf" position="0 0.4 -2"></a-entity>
    
    <!-- 棚の板 -->
    <a-box position="0 0.05 -2" width="5" height="0.1" depth="0.8" color="#8B4513"></a-box>

    <a-entity id="rig" position="0 0 0" movement-controls="fly: false; speed: 0.2">
      <a-entity camera position="0 1.6 0" look-controls></a-entity>
    </a-entity>

    <script>
      // 1. books.json を読み込む
      fetch('books.json')
        .then(response => response.json())
        .then(books => {
          const shelf = document.querySelector('#book-shelf');
          
          books.forEach((book, index) => {
            // 2. 本（a-box）を動的に作成
            const bookEl = document.createElement('a-box');
            
            // 3. 本の横並びの位置を計算（indexを使ってずらす）
            const xPos = (index - (books.length - 1) / 2) * 1.0; 
            
            bookEl.setAttribute('position', `${xPos} 0 0`);
            bookEl.setAttribute('depth', '0.05');
            bookEl.setAttribute('height', '0.6');
            bookEl.setAttribute('width', '0.4');
            bookEl.setAttribute('src', '#default-cover');
            
            // 自作コンポーネントをセット
            bookEl.setAttribute('isbn-cover', book.isbn);
            bookEl.setAttribute('url-link', `url: ${book.url}`);
            
            // アニメーション追加
            bookEl.setAttribute('animation__hover', 'property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200');
            bookEl.setAttribute('animation__leave', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200');
            
            // 棚に追加
            shelf.appendChild(bookEl);
          });
        });
    </script>
  </a-scene>
</body>
