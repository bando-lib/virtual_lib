<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Virtual Book Display - Interactive Demo</title>
    <!-- A-Frameのライブラリを読み込み -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- 追加：移動機能を有効にするためのライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- カスタムコンポーネント -->
    <script>
// 画像URLが実際に読み込めるかテストしてからセットするユーティリティ
function tryLoadImage(url, crossOrigin) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (crossOrigin) img.crossOrigin = crossOrigin;
    img.onload  = () => resolve(url);
    img.onerror = () => reject(new Error('Failed: ' + url));
    img.src = url;
  });
}

// 複数のURLを順番に試して、最初に成功したものを返す
async function findWorkingCoverUrl(isbn) {
  const candidates = [
    // 1. OpenBD（日本語書籍はここが一番正確）
    'https://cover.openbd.jp/' + isbn + '.jpg',
    // 2. Google Books API（日英問わず広いカバレッジ）
    'https://books.google.com/books/content?vid=ISBN' + isbn + '&printsec=frontcover&img=1&zoom=1',
    // 3. Open Library（バックアップ）
    'https://covers.openlibrary.org/b/isbn/' + isbn + '-L.jpg',
  ];

  for (const url of candidates) {
    try {
      await tryLoadImage(url, 'anonymous');
      console.log('[cover] ✓ 成功:', url);
      return url;
    } catch (e) {
      console.log('[cover] ✗ 失敗、次を試します:', url);
    }
  }
  return null; // 全部ダメ → null
}

// 書影を取得してセットするコンポーネント
AFRAME.registerComponent('isbn-cover', {
  schema: { type: 'string' },
  init: async function () {
    var el = this.el;
    var isbn = this.data.replace(/-/g, '');

    const workingUrl = await findWorkingCoverUrl(isbn);

    if (workingUrl) {
      el.setAttribute('material', 'src: url(' + workingUrl + ');
    } else {
      // 全ソース失敗 → タイトルテキストで代替表示
      console.warn('[cover] 書影が見つかりませんでした ISBN:', isbn);
      el.setAttribute('material', 'color: #5a3a1a; roughness: 0.8');
    }
  }
});

// リンククリック機能
AFRAME.registerComponent('url-link', {
  schema: { 
    url: { type: 'string' }
  },
  init: function () {
    var el = this.el;
    var url = this.data.url;

    el.addEventListener('click', function () {
      if (url) {
        window.open(url, '_blank');
      }
    });
  }
});
    </script>
  </head>
  <body>
  <a-scene cursor="rayOrigin: mouse" raycaster="objects: [url-link]">
    <a-assets>
      <img id="default-cover" src="https://placehold.jp/24/cccccc/ffffff/300x450.png?text=Loading...">
    </a-assets>

    <a-sky color="#ECECEC"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#327fa8"></a-plane>
    
    <!-- 本を並べるための「親」要素 -->
    <a-entity id="book-shelf" position="0 0.4 -2"></a-entity>
    
    <!-- 棚の板 -->
    <a-box position="0 0.05 -2" width="5" height="0.1" depth="0.8" color="#8B4513"></a-box>

    <!-- 移動用カメラ設定 -->
    <a-entity id="rig" position="0 0 0" movement-controls="fly: false; speed: 0.2">
      <a-entity camera position="0 1.6 0" look-controls></a-entity>
    </a-entity>

  </a-scene>

  <script>
    // books.json を読み込む
    fetch('books.json')
      .then(response => response.json())
      .then(books => {
        const shelf = document.querySelector('#book-shelf');
        
        books.forEach((book, index) => {
          const bookEl = document.createElement('a-box');
          
          // 位置の計算
          const xPos = (index - (books.length - 1) / 2) * 1.0; 
          
          bookEl.setAttribute('position', `${xPos} 0 0`);
          bookEl.setAttribute('depth', '0.05');
          bookEl.setAttribute('height', '0.6');
          bookEl.setAttribute('width', '0.4');

          // 書影のセット：cover → ISBN複数ソースの順でフォールバック
          (async () => {
            let finalUrl = null;
            if (book.cover) {
              try {
                await tryLoadImage(book.cover, 'anonymous');
                finalUrl = book.cover;
              } catch (e) {
                console.log('[cover] books.json のURLが失敗、ISBNで再試行:', book.isbn);
              }
            }
            if (!finalUrl && book.isbn) {
              finalUrl = await findWorkingCoverUrl(book.isbn.replace(/-/g, ''));
            }
            if (finalUrl) {
              bookEl.setAttribute('material', 'src: url(' + finalUrl + ');
            } else {
              bookEl.setAttribute('material', 'color: #5a3a1a; roughness: 0.8');
            }
          })();

          // リンク先の設定（スペースなしで指定）
          bookEl.setAttribute('url-link', `url: ${book.url}`);

          // ホバー時のアニメーション
          bookEl.setAttribute('animation__hover', 'property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200');
          bookEl.setAttribute('animation__leave', 'property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200');
          
          // ���を空間に追加
          shelf.appendChild(bookEl);
        });
      })
      .catch(err => console.error('JSON読み込みエラー:', err));
  </script>
</body>
</html>
